<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Hunt Dashboard</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --green:#3fb950; --amber:#d29922; --pink:#f778ba; --purple:#bc8cff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; max-width:1100px; margin:0 auto}
  header{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  h1{font-size:1.4rem} h1 span{color:var(--accent)}
  #updated{color:var(--muted); font-size:.8rem}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px}
  .stat .num{font-size:1.5rem; font-weight:700}
  .stat .lbl{color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.5px}
  .controls{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center}
  #search{flex:1; min-width:200px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 12px; font-size:.9rem}
  .chip{border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:20px; padding:6px 14px; font-size:.8rem; cursor:pointer; user-select:none}
  .chip.on{background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:600}
  #appliedToggle{color:var(--muted)}
  #appliedToggle.on{color:var(--green); border-color:var(--green)}
  .jobs{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px}
  .job{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; opacity:1; transition:opacity .2s}
  .job.applied{opacity:.45}
  .job .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .badge{font-size:.65rem; font-weight:700; padding:2px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:.5px}
  .b-Hirist{background:#1f6feb33; color:#79c0ff}
  .b-Tier-1{background:#3fb95033; color:#56d364}
  .b-Instahyre{background:#bc8cff33; color:#d2a8ff}
  .b-Foreign{background:#d2992233; color:#e3b341}
  .job h3{font-size:.95rem; line-height:1.25}
  .company{color:var(--muted); font-size:.85rem}
  .meta{display:flex; flex-wrap:wrap; gap:6px; color:var(--muted); font-size:.75rem}
  .meta span{background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:2px 8px}
  .job .actions{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
  .apply{background:var(--accent); color:#0d1117; text-decoration:none; font-weight:600; font-size:.8rem; padding:6px 14px; border-radius:8px}
  .apply:hover{filter:brightness(1.1)}
  .applied-box{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.8rem; cursor:pointer}
  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0}
  footer{margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center; line-height:1.6}
  .note{color:var(--amber)}
</style>
</head>
<body>
<header>
  <h1>💼 Job Hunt <span>Dashboard</span></h1>
  <div id="updated">loading…</div>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <input id="search" type="search" placeholder="Search title / company…">
  <div class="chip on" data-src="All">All</div>
  <div class="chip" data-src="Hirist">Hirist</div>
  <div class="chip" data-src="Tier-1">Tier-1</div>
  <div class="chip" data-src="Instahyre">Instahyre</div>
  <div class="chip" data-src="Foreign">Foreign Remote</div>
  <div class="chip" id="appliedToggle">✅ Applied only</div>
</div>

<div class="jobs" id="jobs"></div>

<footer>
  <div>Auto-generated by local cron scripts · data pushed to GitHub Pages · no server</div>
  <div id="footnote" class="note"></div>
</footer>

<script>
const LS_KEY = "jobdash.applied";
let DATA = {jobs: [], updated_at: ""};
let state = {src: "All", q: "", appliedOnly: false};

function loadLocalApplied(){
  try{ return new Set(JSON.parse(localStorage.getItem(LS_KEY) || "[]")); }catch(e){ return new Set(); }
}
function saveLocalApplied(s){
  localStorage.setItem(LS_KEY, JSON.stringify([...s]));
}
let localApplied = loadLocalApplied();

function esc(s){
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function isApplied(j){
  return !!(j.applied || localApplied.has(j.id));
}
function renderStats(){
  const jobs = DATA.jobs;
  const applied = jobs.filter(isApplied).length;
  const bySrc = {};
  for(const j of jobs){ bySrc[j.source] = (bySrc[j.source]||0)+1; }
  let html = `
    <div class="stat"><div class="num">${jobs.length}</div><div class="lbl">Suggestions</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${applied}</div><div class="lbl">Applied</div></div>
    <div class="stat"><div class="num" style="color:var(--accent)">${bySrc["Hirist"]||0}</div><div class="lbl">Hirist</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${bySrc["Tier-1"]||0}</div><div class="lbl">Tier-1</div></div>
    <div class="stat"><div class="num" style="color:var(--purple)">${bySrc["Instahyre"]||0}</div><div class="lbl">Instahyre</div></div>
    <div class="stat"><div class="num" style="color:var(--amber)">${bySrc["Foreign"]||0}</div><div class="lbl">Foreign Remote</div></div>`;
  document.getElementById("stats").innerHTML = html;
}
function renderJobs(){
  const q = state.q.toLowerCase();
  const list = DATA.jobs.filter(j => {
    if(state.src !== "All" && j.source !== state.src) return false;
    if(state.appliedOnly && !isApplied(j)) return false;
    if(q && !(j.title+" "+(j.company||"")+" "+(j.location||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  const el = document.getElementById("jobs");
  if(!list.length){ el.innerHTML = `<div class="empty">No jobs match your filters 🕵️</div>`; return; }
  el.innerHTML = list.map(j => {
    const app = isApplied(j);
    const meta = [j.location, j.exp, j.salary, j.posted ? "Posted "+j.posted : ""].filter(Boolean)
      .map(m => `<span>${esc(m)}</span>`).join("");
    return `<div class="job ${app?"applied":""}" data-id="${esc(j.id)}">
      <div class="top"><h3>${esc(j.title)}</h3><span class="badge b-${esc(j.source.replace(/\s+/g,"-"))}">${esc(j.source)}</span></div>
      <div class="company">${esc(j.company || "—")}</div>
      <div class="meta">${meta}</div>
      <div class="actions">
        <a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply ↗</a>
        <label class="applied-box"><input type="checkbox" data-id="${esc(j.id)}" ${app?"checked":""}> applied</label>
      </div>
    </div>`;
  }).join("");
  // bind checkboxes
  document.querySelectorAll(".applied-box input").forEach(cb => {
    cb.onchange = () => {
      const id = cb.dataset.id;
      cb.checked ? localApplied.add(id) : localApplied.delete(id);
      saveLocalApplied(localApplied);
      renderJobs(); renderStats();
    };
  });
}
function applyFilters(){
  document.querySelectorAll(".chip[data-src]").forEach(c => c.classList.toggle("on", c.dataset.src === state.src));
  document.getElementById("appliedToggle").classList.toggle("on", state.appliedOnly);
  renderJobs();
}
document.querySelectorAll(".chip[data-src]").forEach(c => c.onclick = () => { state.src = c.dataset.src; applyFilters(); });
document.getElementById("appliedToggle").onclick = () => { state.appliedOnly = !state.appliedOnly; applyFilters(); };
document.getElementById("search").oninput = e => { state.q = e.target.value; renderJobs(); };

fetch("data/jobs.json").then(r => r.json()).then(d => {
  DATA = d;
  const t = d.updated_at ? "Last updated: " + d.updated_at : "";
  document.getElementById("updated").textContent = t;
  const srcs = [...new Set(d.jobs.map(j => j.source))];
  const note = d.jobs.some(j => j.source === "Instahyre")
    ? "ℹ️ Instahyre section = snapshot from last digest run. Naukri + Google Alerts: coming soon."
    : "ℹ️ Naukri + Google Alerts: coming soon.";
  document.getElementById("footnote").textContent = note;
  renderStats(); renderJobs();
}).catch(e => {
  document.getElementById("jobs").innerHTML = `<div class="empty">Could not load data/jobs.json 😕</div>`;
});
</script>
</body>
</html>
